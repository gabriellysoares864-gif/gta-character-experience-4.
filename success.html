<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seu trailer — GTA Character Experience</title><style>body{margin:0;background:#080811;color:#f5f4ff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(680px,92vw);background:#11111d;border:1px solid #34334a;border-radius:22px;padding:28px;text-align:center;box-sizing:border-box}h1{letter-spacing:2px}p{color:#b9b7cc;line-height:1.6}.progress{height:8px;background:#29283b;border-radius:99px;overflow:hidden;margin:24px 0}.progress div{height:100%;width:25%;background:linear-gradient(90deg,#7c5cff,#42e9ff);transition:width .5s}.video{width:100%;max-height:70vh;background:#000;border-radius:14px;margin-top:18px}.btn{display:inline-block;background:linear-gradient(90deg,#7c5cff,#38dfff);color:#080811;font-weight:700;text-decoration:none;padding:14px 22px;border-radius:12px;margin-top:16px}.hidden{display:none}.error{color:#ff8a9d}</style></head><body><main class="wrap"><h1>GTA CHARACTER EXPERIENCE</h1><h2 id="headline">Confirmando seu pagamento…</h2><p id="message">Estamos verificando sua compra com segurança. Assim que for aprovada, seu trailer será criado.</p><div class="progress"><div id="bar"></div></div><video id="video" class="video hidden" controls playsinline></video><a id="download" class="btn hidden" download="meu-trailer-vice-city.mp4">BAIXAR MEU TRAILER</a></main><script>
const headline=document.getElementById('headline'),message=document.getElementById('message'),bar=document.getElementById('bar');
const intentId=sessionStorage.getItem('gta_character_intent');const answers=sessionStorage.getItem('gta_character_answers');const prompt=sessionStorage.getItem('gta_character_prompt');
function fail(t){headline.textContent='Não foi possível continuar';message.textContent=t;message.className='error';bar.style.width='0%';}
function getPhoto(){return new Promise((resolve,reject)=>{const r=indexedDB.open('GTACharacterExperience',1);r.onerror=()=>reject(new Error('Foto não encontrada no dispositivo.'));r.onsuccess=()=>{const db=r.result;const tx=db.transaction('assets','readonly');const q=tx.objectStore('assets').get('reference_photo');q.onsuccess=()=>{db.close();if(q.result?.blob)resolve(q.result.blob);else reject(new Error('A foto enviada não foi encontrada.'));};q.onerror=()=>reject(new Error('Não foi possível recuperar a foto.'));};});}
async function waitPayment(){if(!intentId){fail('Não encontramos os dados desta compra neste navegador. Entre em contato com o suporte.');return;}for(let i=0;i<60;i++){try{const r=await fetch('/.netlify/functions/payment-status?intentId='+encodeURIComponent(intentId),{cache:'no-store'});const d=await r.json();if(d.paid){bar.style.width='35%';headline.textContent='Pagamento confirmado!';if(d.videoUrl){showVideo(d.videoUrl);return;}message.textContent='Agora estamos criando seu trailer cinematográfico de 15 segundos.';if(d.taskId){bar.style.width='70%';await poll(d.taskId);return;}await generate();return;}}catch{}await new Promise(r=>setTimeout(r,5000));}fail('Ainda não recebemos a confirmação. Se o pagamento foi aprovado, aguarde alguns minutos e atualize esta página.');}
async function generate(){try{const photo=await getPhoto();const form=new FormData();form.append('photo',photo,'reference.jpg');form.append('answers',answers||'{}');form.append('prompt',prompt||'');form.append('intentId',intentId);bar.style.width='55%';const r=await fetch('/.netlify/functions/generate-avatar',{method:'POST',body:form});const d=await r.json();if(!r.ok||!d.taskId)throw new Error(d.error||'Não foi possível iniciar a geração.');bar.style.width='70%';await poll(d.taskId);}catch(e){fail(e.message||'Erro ao gerar o vídeo.');}}
function showVideo(videoUrl){bar.style.width='100%';headline.textContent='Seu trailer está pronto!';message.textContent='Assista ao seu personagem em Vice City e baixe o vídeo para guardar e compartilhar.';const v=document.getElementById('video');v.src=videoUrl;v.classList.remove('hidden');const a=document.getElementById('download');a.href=videoUrl;a.classList.remove('hidden');}
async function poll(taskId){for(let i=0;i<90;i++){const r=await fetch('/.netlify/functions/generate-avatar?taskId='+encodeURIComponent(taskId),{cache:'no-store'});const d=await r.json();if(d.status==='completed'&&d.videoUrl){showVideo(d.videoUrl);return;}if(d.status==='failed')throw new Error(d.error||'A geração falhou.');await new Promise(r=>setTimeout(r,5000));}fail('A geração está demorando mais que o esperado. Atualize a página para consultar novamente.');}
waitPayment();</script></body></html>
